description: >-
  Altus Group publishes no pricing for ARGUS. There is no pricing page, no plan tiers, no
  quota table, and no self-serve signup — every ARGUS product routes to a contact form or a
  sales conversation, and the ARGUS API is licensed as part of a cloud-enabled ARGUS
  subscription rather than sold on its own. This file records that absence as measured
  fact.
