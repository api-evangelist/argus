description: >-
  Altus Group publishes no rate limits for the ARGUS API. No public API reference exists,
  so no documented quota, window, burst ceiling or exhaustion status code could be read.
  No rate-limit response headers could be observed either: every reachable ARGUS service
  endpoint answers anonymous requests with HTTP 403 "Missing Authentication Token" before
  any limit is applied.
