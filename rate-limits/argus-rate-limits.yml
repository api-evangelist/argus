    (core-service-v1, backend-v1, stewardship-v1, mdmapisvc-v1, derived_domains-v1,
    stress-testing-v1 on platform.altusintelligence.com) return 403 from the fronting AWS
    API Gateway with no RateLimit-* or X-RateLimit-* headers.
