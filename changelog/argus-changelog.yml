    type: breaking
    highlight: ARGUS Enterprise version 13 is removed from ARGUS Cloud.
  - date: '2027-01-01'
    type: breaking
    highlight: >-
      All access to ARGUS Enterprise version 13 on ARGUS Cloud is permanently discontinued;
      ARGUS Intelligence Platform authentication becomes mandatory to connect to the
      database, requiring AE 14.5.0.930 or AE 15.0.1.1170 or later.
